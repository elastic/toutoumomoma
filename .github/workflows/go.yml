name: Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x,1.26.9]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go-version }}

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Garble
      run: go install -C tools mvdan.cc/garble

    - name: Test
      run: go test ./...

    - name: Test Race
      run: go test -race ./...

    - name: Test FIPS
      run: go test -tags requirefips ./...
      env:
        GODEBUG: fips140=only
